[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-dicom-viewer"
version = "0.1.0"
description = "View Synapse-hosted DICOM studies in OHIF Viewer via a thin DICOMweb shim"
requires-python = ">=3.10"
dependencies = [
    "synapseclient>=4.0.0",
    "requests>=2.31.0",
    "fastapi>=0.111.0",
    # Pinned floors for transitive packages carrying known advisories:
    "starlette>=1.3.1",   # via fastapi - GHSA-82w8-qh3p-5jfq, GHSA-wqp7-x3pw-xc5r, GHSA-86qp-5c8j-p5mr
    "idna>=3.15",         # via requests/httpx/anyio - GHSA-65pc-fj4g-8rjx
    "setuptools>=83.0.0", # via synapseclient - GHSA-h35f-9h28-mq5c
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydicom>=3.0.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
synapse-dicom-viewer = "synapse_dicom_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_dicom_viewer"]

[tool.hatch.build.targets.wheel.force-include]
"src/synapse_dicom_viewer/static" = "synapse_dicom_viewer/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
