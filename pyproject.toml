[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-dicom-viewer"
version = "0.1.0"
description = "View Synapse-hosted DICOM studies in OHIF Viewer via a thin DICOMweb shim"
requires-python = ">=3.10"
dependencies = [
    "synapseclient>=4.0.0",
    "requests>=2.31.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydicom>=3.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
synapse-dicom-viewer = "synapse_dicom_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_dicom_viewer"]

[tool.hatch.build.targets.wheel.force-include]
"src/synapse_dicom_viewer/static" = "synapse_dicom_viewer/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
